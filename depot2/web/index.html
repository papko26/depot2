<!doctype html>
<html lang="en">
<head>

<title>depot2</title>
<link rel="icon" href="data:,">

<style>
:root {
  --bg: #f6f5f1; --card: #ffffff; --ink: #1d1c1a; --muted: #6b675f; --line: #e2dfd7; --soft: #efede7;
  --link: #1f5fbf; --warn: #a3450b; --bad: #b3261e; --ok: #2e7d32; --focus: #1f5fbf;
  --st-bogie: #8a6a4f; --st-sketch: #b98a00; --st-project: #7a4fc4; --st-build: #1e6fd9; --st-docs: #a53f8c;
  --st-acceptance: #00897b; --st-queued: #d9620b; --st-rolling: #3b9a3f; --st-arrived: #2b6630; --st-scrapped: #7d7a74;
  --panel-w: min(760px, 100vw);
  --tab-strip: rgb(20 20 20 / 0.07); --tab-hover: rgb(20 20 20 / 0.06); --tab-on: #ffffff; --tab-on-ink: #282828; --tab-ink: #373737;
  --font-ui: "FreeSans", "Liberation Sans", Arial, Helvetica, sans-serif;
  --mark: #fde68a;  /* a found word */
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161614; --card: #201f1c; --ink: #ecebe6; --muted: #a29e95; --line: #35332e; --soft: #2a2925;
    --link: #8ab4ff; --warn: #f0a868; --bad: #ff8a80; --ok: #8fd694; --focus: #8ab4ff;
    --st-bogie: #c49a76; --st-sketch: #e3b53a; --st-project: #b28cf0; --st-build: #66a6ff; --st-docs: #e48ccf;
    --st-acceptance: #3fc2b0; --st-queued: #ff9a4d; --st-rolling: #79cf7d; --st-arrived: #a6dba9; --st-scrapped: #a8a49c;
    --tab-strip: rgb(236 235 230 / 0.07); --tab-hover: rgb(236 235 230 / 0.06); --tab-on: #45433d; --tab-on-ink: #ecebe6; --tab-ink: #cfccc4;
    --mark: #6b5714;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color: var(--link); }
button { font: inherit; color: inherit; }

.s-bogie { --c: var(--st-bogie); } .s-sketch { --c: var(--st-sketch); } .s-project { --c: var(--st-project); }
.s-build { --c: var(--st-build); } .s-docs { --c: var(--st-docs); } .s-acceptance { --c: var(--st-acceptance); }
.s-queued { --c: var(--st-queued); }
.s-rolling { --c: var(--st-rolling); } .s-arrived { --c: var(--st-arrived); } .s-scrapped { --c: var(--st-scrapped); }

  padding: 10px 16px; background: var(--card); border-bottom: 1px solid var(--line); }

.top .ro { font-size: 12px; color: var(--muted); }
.tabs { display: flex; flex-wrap: wrap; min-width: 0; max-width: 100%; border-radius: 12px; background: var(--tab-strip); }
.tabs button { flex: 1 1 auto; display: inline-flex; align-items: center; justify-content: center; min-height: 34px; margin: 0;
  padding: 0 12px; border: 3px solid transparent; border-radius: 12px; background: none; background-clip: padding-box;
  color: var(--tab-ink); font: 600 12.5px/1 var(--font-ui); white-space: nowrap; cursor: pointer; }
.tabs button:hover:not([aria-selected="true"]) { background-color: var(--tab-hover); }
.tabs button[aria-selected="true"] { background-color: var(--tab-on); color: var(--tab-on-ink); }
.tabs button:focus-visible { outline-offset: -1px; }  /* the ring on the pill's edge, inside the strip */
@media (pointer: coarse) { .tabs button { min-height: 44px; } }  /* a finger's 44 */
.tabs .tcnt { margin-left: 6px; font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
.find { display: flex; align-items: center; gap: 6px; flex: 0 1 400px; min-width: 0; }
.find input, .find select { font: inherit; min-height: 30px; border: 1px solid var(--line); border-radius: 6px; color: var(--ink); }
.find input { flex: 1 1 8em; min-width: 0; padding: 3px 8px; background: var(--bg); }

@media (pointer: coarse) { .find input, .find select { min-height: 40px; } }
mark { background: var(--mark); color: inherit; border-radius: 2px; }
.hit { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.nohit { opacity: 0.35; }
.btn { border: 1px solid var(--line); background: var(--soft); border-radius: 6px; padding: 4px 12px; cursor: pointer; }
.btn:hover { border-color: var(--muted); }
.spacer { flex: 1; }
.chk { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); }
#stamp { font-variant-numeric: tabular-nums; color: var(--muted); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.err { margin: 10px 16px 0; padding: 8px 12px; border: 1px solid var(--bad); border-radius: 6px; color: var(--bad); background: var(--card); }
main { padding: 12px 16px 40px; }
body.with-panel main { margin-right: var(--panel-w); }

.summary { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 0 0 12px; color: var(--muted); }
.summary b { color: var(--ink); font-weight: 600; }
.summary b.w { color: var(--warn); } .summary b.g { color: var(--ok); }  /* a word marked in the line: riding, not riding */
.summary > span { min-width: 0; overflow-wrap: anywhere; }  /* a long path (the principles' file) wraps on a phone */

/* the tracks and the trains */
#view-trains .grid, #view-tracks .grid { display: grid; gap: 10px; max-width: 1400px; }
.train { background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }

.train > details > summary::-webkit-details-marker { display: none; }

.train > details[open] > summary::before { content: "▾"; }
.tnum { color: var(--muted); font-variant-numeric: tabular-nums; }
.tid { font-weight: 600; font-variant-numeric: tabular-nums; }
.ttitle { font-weight: 600; flex: 1 1 20em; min-width: 0; }
.tstat { flex-basis: 100%; padding-left: 1.9em; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.tstat.w { color: var(--warn); }
.tcost { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.badge { display: inline-block; border-radius: 10px; padding: 0 8px; font-size: 12px; border: 1px solid currentColor; white-space: nowrap; }
.b-design { color: var(--st-sketch); } .b-impl { color: var(--st-build); } .b-merge { color: var(--st-queued); }
.b-arrived { color: var(--st-arrived); } .b-scrapped { color: var(--muted); } .b-open { color: var(--st-build); } .b-done { color: var(--st-arrived); }
.tname { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
.lnk { display: inline-block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; vertical-align: bottom; font-size: 12px;
  padding: 0 6px; border-radius: 9px; background: var(--soft); white-space: nowrap; }
.code { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.code.w { color: var(--warn); }
.tmeta { padding: 0 12px 8px 32px; display: grid; gap: 2px; font-size: 13px; }
.tmeta .k { color: var(--muted); }
.counts { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 0 6px; border-radius: 9px; background: var(--soft); white-space: nowrap; }
.chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--muted)); }
.cars { border-top: 1px solid var(--line); }
.car { display: grid; grid-template-columns: calc(2.6em + 19px) minmax(0, 1fr) auto; gap: 2px 10px; padding: 7px 12px 7px 8px;
  border-top: 1px solid var(--line); cursor: pointer; align-items: start; }
.car:first-child { border-top: 0; }
.car:hover { background: var(--soft); }
.car.sel { background: var(--soft); box-shadow: inset 3px 0 0 var(--focus); }
.c-n { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; padding-top: 1px; white-space: nowrap; }
.c-title { font-weight: 500; overflow-wrap: anywhere; }
.c-sub, .c-wait { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.c-wait .w { color: var(--warn); }
.c-wait .g { color: var(--ok); }
.c-route { grid-column: 2 / 4; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.open { border: 1px solid var(--line); background: var(--card); border-radius: 6px; padding: 1px 8px; font-size: 12px; cursor: pointer; }
.cars:not(.more-open) .car.fin { display: none; }
.fin-toggle { display: block; width: 100%; text-align: left; border: 0; border-top: 1px solid var(--line); background: none; color: var(--muted); padding: 6px 12px 6px 46px; cursor: pointer; }
.fin-toggle:hover { background: var(--soft); }
.moved { border-top: 1px solid var(--line); padding: 6px 12px 6px 46px; font-size: 12px; }
.done-group { margin-top: 16px; }
.done-group > summary { cursor: pointer; color: var(--muted); margin-bottom: 8px; }

/* the route */
.route { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 3px; margin: 0; padding: 0; list-style: none; }
.route li { height: 16px; min-width: 12px; border-radius: 8px; border: 1.5px solid var(--c); font-size: 11px; line-height: 13px; padding: 0 2px; }
.route li.past { background: var(--c); opacity: 0.38; }
.route li.skip { border-style: dashed; opacity: 0.6; }
.route li.cur { background: var(--c); color: #fff; padding: 0 7px; font-weight: 600; }
@media (prefers-color-scheme: dark) { .route li.cur { color: #111; } }
.route.full li { height: auto; padding: 2px 8px; font-size: 12px; line-height: 16px; border-radius: 10px; }
.route.full li.past { opacity: 1; background: transparent; color: var(--muted); }
.route.full li.fut { color: var(--muted); }
.route.full .arr { border: 0; min-width: 0; padding: 0; color: var(--muted); }
.next { font-size: 12px; color: var(--muted); }

/* the board */
.board { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 1fr)); gap: 12px; align-items: start; }
.col { background: var(--card); border: 1px solid var(--line); border-top: 4px solid var(--c); border-radius: 8px; padding: 8px; }
.col h3 { margin: 0; font-size: 15px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; }
.col h3 .cnt { font-variant-numeric: tabular-nums; color: var(--muted); }
.col .lim { font-size: 12px; font-weight: 400; color: var(--muted); }
.col .lim.full { color: var(--warn); } .col .lim.over { color: var(--bad); font-weight: 600; }
.col .means { margin: 2px 0 8px; font-size: 12px; color: var(--muted); }
.bcard { border: 1px solid var(--line); border-left: 3px solid var(--c); border-radius: 6px; padding: 6px 8px; margin-top: 6px; cursor: pointer; background: var(--card); }
.bcard:hover { background: var(--soft); }
.bcard.sel { box-shadow: 0 0 0 2px var(--focus); }
.bcard .ref { font-weight: 600; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.bcard .t { overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.bcard .m { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.bcard .gate { font-size: 12px; color: var(--warn); }
.bcard .gate.ok { color: var(--ok); }
.slots { background: var(--card); border: 1px solid var(--line); border-top: 4px solid var(--c); border-radius: 8px; padding: 8px; margin: 0 0 12px; }
.slots h3 { margin: 0 0 4px; font-size: 15px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; }
.slots h3 .cnt { font-variant-numeric: tabular-nums; color: var(--muted); }
.slots .lim { font-size: 12px; font-weight: 400; color: var(--muted); } .slots .lim.full { color: var(--warn); } .slots .lim.over { color: var(--bad); font-weight: 600; }
.slot-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(170px, 100%), 1fr)); gap: 8px; }
.slot { border: 1px solid var(--line); border-left: 3px solid var(--c); border-radius: 6px; padding: 6px 8px; background: var(--card); min-width: 0; }
.slot[data-ref] { cursor: pointer; } .slot[data-ref]:hover { background: var(--soft); } .slot.sel { box-shadow: 0 0 0 2px var(--focus); }
.slot.free { border-style: dashed; color: var(--muted); }
.slot .sn { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.slot .stg { color: var(--c); font-weight: 600; }
.slot .ref { font-weight: 600; font-size: 12.5px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.slot .t { overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.slot .m { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; } .slot .gate { font-size: 12px; color: var(--warn); } .slot .gate.ok { color: var(--ok); }
.slot-next { margin-top: 8px; font-size: 13px; display: grid; gap: 2px; }
.slot-next .lbl { color: var(--muted); }
.nchip { display: inline-block; padding: 0 6px; margin: 1px 2px; border-radius: 9px; background: var(--soft); cursor: pointer; overflow-wrap: anywhere; }
.nchip:hover { box-shadow: 0 0 0 1px var(--line); }
.col:not(.more-open) .extra { display: none; }
.more { margin-top: 8px; width: 100%; }
.busy { background: var(--card); border: 1px solid var(--line); border-top: 4px solid var(--c); border-radius: 8px; padding: 6px 8px 8px; margin: 0 0 12px; }
.busy h3 { margin: 0 0 4px; font-size: 15px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; }
.busy h3 .cnt { font-variant-numeric: tabular-nums; color: var(--muted); }
.busy .go { font-size: 12.5px; font-weight: 400; margin-left: auto; }
.busy-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(240px, 100%), 1fr)); gap: 4px 8px; }
.bchip { display: flex; align-items: baseline; gap: 6px; min-width: 0; padding: 2px 6px; border-left: 3px solid var(--c); border-radius: 4px; background: var(--soft); cursor: pointer; font-size: 13px; }
.bchip:hover { box-shadow: 0 0 0 1px var(--line); } .bchip.sel { box-shadow: 0 0 0 2px var(--focus); }
.bchip .ref { font-weight: 600; font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.bchip .t { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bchip .m { color: var(--muted); font-size: 12px; white-space: nowrap; }
.bchip .stg { color: var(--c); font-weight: 600; }
.slot-row.wide { grid-template-columns: repeat(auto-fill, minmax(min(250px, 100%), 1fr)); }
.slot .ag { margin-top: 4px; padding-top: 4px; border-top: 1px dashed var(--line); font-size: 12.5px; overflow-wrap: anywhere; }
.slot .ag .m { font-size: 12px; }
.slot .ag.none { color: var(--muted); }
.slot-free { margin-top: 6px; font-size: 13px; }
.ast { font-weight: 600; } .ast.st-working { color: var(--ok); } .ast.st-silent, .ast.st-unattached, .ast.st-lost { color: var(--warn); }
.ast.st-finished, .ast.st-stopped { color: var(--muted); }
.alist { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; margin: 0 0 12px; }
.alist h3 { margin: 0 0 2px; font-size: 15px; } .alist h3 .cnt { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 400; }
.arow { padding: 5px 4px; border-top: 1px solid var(--line); cursor: pointer; font-size: 13px; overflow-wrap: anywhere; }
.arow:first-of-type { border-top: 0; }
.arow:hover { background: var(--soft); } .arow.sel { background: var(--soft); box-shadow: inset 3px 0 0 var(--focus); }
.arow .m { font-size: 12px; color: var(--muted); }
.alist:not(.more-open) .extra { display: none; }
ol.acts { margin: 0; padding-left: 22px; font-size: 13px; } ol.acts li { overflow-wrap: anywhere; } ol.acts .tm { color: var(--muted); font-variant-numeric: tabular-nums; }

.pc-sec { margin: 0 0 18px; max-width: 1040px; }
.pc-sec h3 { margin: 0 0 8px; font-size: 16px; }
.pc-sec h3 .cnt { color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
.pc { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px 8px; margin: 0 0 8px; }
.pc.third { border-left: 4px solid var(--link); }
.pc.off { opacity: 0.62; }
.pc-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; font-size: 12.5px; color: var(--muted); }
.pc-h .pcn { font-weight: 700; font-size: 15px; color: var(--ink); font-variant-numeric: tabular-nums; min-width: 1.6em; }
.badge3 { display: inline-block; padding: 0 8px; border-radius: 9px; background: var(--link); color: var(--bg); font-weight: 600; font-size: 12px; }

.dp { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.dp-col { min-width: 0; max-height: calc(100vh - var(--top-h, 0px) - 28px); max-height: calc(100dvh - var(--top-h, 0px) - 28px);
  overflow-y: auto; overscroll-behavior: contain; padding-right: 4px; }
.dp-h { margin: 0 0 8px; font-size: 17px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.dp-h .cnt { font-size: 13px; font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
.dp-switch { display: none; gap: 4px; margin: 0 0 10px; }
.dp-switch .btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.dec-tools { position: sticky; top: 0; z-index: 1; background: var(--bg); padding: 0 0 8px; }
.dec { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px 8px; margin: 0 0 8px; }
.dec.flash { box-shadow: 0 0 0 2px var(--focus); }
.dec-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; font-size: 12.5px; color: var(--muted); }
.dec-h .tid { color: var(--ink); }
.dec-t { overflow-wrap: anywhere; white-space: pre-line; margin-top: 2px; }
.rlink { color: var(--link); cursor: pointer; text-decoration: underline dotted; }
.rlink.sel { background: var(--soft); border-radius: 3px; }
.note { font-size: 12px; margin: 10px 0 0; }

.qboard { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(min(290px, 84vw), 1fr); gap: 12px; align-items: start;
  overflow-x: auto; overscroll-behavior-x: contain; scroll-snap-type: x proximity; padding-bottom: 8px; }
.qcol { scroll-snap-align: start; min-width: 0; display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line);
  border-top: 4px solid var(--link); border-radius: 8px; padding: 8px;
  max-height: calc(100vh - var(--top-h, 0px) - 96px); max-height: calc(100dvh - var(--top-h, 0px) - 96px); }
.qcol.empty { border-top-color: var(--line); }
.qcol h3 { margin: 0; font-size: 15px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; }
.qcol h3 .cnt { font-variant-numeric: tabular-nums; color: var(--muted); }
.qcol .means { margin: 2px 0 4px; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.overview { margin: 0 0 14px; } .overview h3 { margin: 0 0 4px; font-size: 15px; }
.overview code { font-size: 11.5px; } .overview td:first-child { overflow-wrap: normal; min-width: 6em; }
@media (max-width: 700px) {  /* a phone: a row is its name and count, then what is on top, then what it is */
  .overview thead { display: none; }
  .overview tr { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; border-top: 1px solid var(--line); padding: 4px 0; }
  .overview tr td { border-top: 0; padding: 0; }
  .overview td:nth-child(3), .overview td:nth-child(4) { grid-column: 1 / -1; }
}
.qlist { overflow-y: auto; min-height: 0; overscroll-behavior-y: contain; }
.qcard { border: 1px solid var(--line); border-left: 3px solid var(--qc, var(--line)); border-radius: 6px; padding: 6px 8px; margin-top: 6px; background: var(--card); }
.qcard.p-high { --qc: var(--warn); } .qcard.p-normal { --qc: var(--link); } .qcard.p-later { --qc: var(--muted); }
.qcard[data-ref], .qcard[data-qx] { cursor: pointer; } .qcard[data-ref]:hover, .qcard[data-qx]:hover { background: var(--soft); }
.qcard.sel { box-shadow: 0 0 0 2px var(--focus); }
.qcard.closed { opacity: 0.62; }
.qcard .qh { display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: baseline; font-size: 12px; color: var(--muted); }
.qcard .qh .tid { font-size: 12.5px; color: var(--ink); }
.qcard .qh .stg { color: var(--c); font-weight: 600; }

  const op = e.target.closest("a[data-open]");
  if (op) { e.preventDefault(); openCar(op.dataset.open); return; }
  const go = e.target.closest("a[data-go]");
  if (go) {
    e.preventDefault();
    if (go.dataset.mq && go.closest("#panel") && matchMedia("(max-width: 1599px)").matches) closePanel();  // the panel covers the page
    ui.tab = go.dataset.go; showTab(); writeHash();
    if (go.dataset.mq) showEntry(go.dataset.mq); else window.scrollTo(0, 0);
    return;
  }
  const rl = e.target.closest("#panel .rlink[data-ref]");
  if (rl) { e.preventDefault(); if (ui.car !== rl.dataset.ref) openCar(rl.dataset.ref); return; }
  if (e.target.closest("a")) return;
  const side = e.target.closest(".dp-switch [data-side]");
  if (side) { ui.side = side.dataset.side; showSide(); return; }
  const tab = e.target.closest(".tabs button");
  if (tab) { ui.tab = tab.dataset.tab; showTab(); writeHash(); return; }
  const more = e.target.closest("[data-more]");
  if (more) { ui.more[more.dataset.more] = !ui.more[more.dataset.more]; render(); return; }
  if (e.target.closest("summary")) return;
  const row = e.target.closest("[data-ref], [data-qx]");
  if (!row || e.target.closest("#panel")) return;
  const sel = getSelection();
  if (sel && !sel.isCollapsed && row.contains(sel.anchorNode)) return;
  if (row.hasAttribute("data-qx")) { toggleQ(row); return; }
  if (ui.car === row.dataset.ref && row.matches(CARDS)) closePanel();
  else openCar(row.dataset.ref);
});
// the arrows up and down: to the card above or below in the same column (a queue, a board's column, a train's cars)
function stepCard(el, d) {
  if (!el.matches(COLUMN_CARDS)) return false;
  const sib = [...el.parentElement.children].filter((c) => c.matches(COLUMN_CARDS) && shownBox(c));
  const n = sib[sib.indexOf(el) + d];
  if (!n) return false;
  n.focus({ preventScroll: true });
  reveal(n);
  return true;
}
document.addEventListener("keydown", (e) => {
  const typing = !!(e.target.closest && e.target.closest("input, textarea, select, [contenteditable]"));
  if ((e.key === "/" || (e.code === "Slash" && !e.shiftKey)) && !typing && !e.ctrlKey && !e.metaKey && !e.altKey) {
    e.preventDefault();
    $("#q").focus();
    $("#q").select();
    return;
  }
  if (e.key === "Escape" && e.target === $("#q") && $("#q").value) { e.preventDefault(); $("#q").value = ""; applyFind(); return; }
  const card = e.target.matches && e.target.matches(CARDS) ? e.target : null;
  if (e.key === "Escape" && card && card.hasAttribute("data-qx") && ui.open[card.dataset.qx]) { toggleQ(card); return; }
  if (e.key === "Escape" && ui.car) { closePanel(); return; }
  if (e.key === "Escape" && ui.q && !typing) { $("#q").value = ""; applyFind(); return; }
  if (!card || e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === "Enter" || e.key === " ") {
    e.preventDefault();
    if (card.hasAttribute("data-qx")) toggleQ(card);
    else if (ui.car === card.dataset.ref) closePanel();
    else openCar(card.dataset.ref);
  } else if ((e.key === "ArrowDown" || e.key === "ArrowUp") && stepCard(card, e.key === "ArrowDown" ? 1 : -1)) e.preventDefault();
});
document.addEventListener("toggle", (e) => {
  const d = e.target;
  if (!d.dataset || !d.dataset.key || !d.isConnected) return;  // one a newer drawing replaced: its state is not the view's
  if (find.on && !d.dataset.key.startsWith("qc:")) ui.findOpen[d.dataset.key] = d.open;  // folded during a search: for it alone
  else if (d.dataset.key === "__done") ui.doneOpen = d.open;
  else ui.open[d.dataset.key] = d.open;
  if (d.dataset.key.startsWith("qc:") && data) render();  // a queue's closed ones are drawn when unfolded
}, true);
document.addEventListener("scroll", (e) => {
  const b = e.target;
  if (b && b.dataset && b.dataset.sk && shownBox(b)) ui.scroll[b.dataset.sk] = [b.scrollLeft, b.scrollTop];  // paint() gives it back
  placeTip();
}, { capture: true, passive: true });
$("#close").addEventListener("click", closePanel);
$("#back").addEventListener("click", () => { ui.doc = null; shown.panel = ""; loadPanel(); });
$("#refresh").addEventListener("click", () => refresh());
$("#q").addEventListener("input", () => { clearTimeout(findTimer); findTimer = setTimeout(applyFind, 150); });
$("#q").addEventListener("search", applyFind);  // Enter, or the field's own ✕: at once
$("#sort").addEventListener("change", (e) => { ui.sort = e.target.value; writeHash(); if (data) { render(); listsToTop(); } else paintFind(); });
$("#all").addEventListener("change", (e) => { ui.all = e.target.checked; ui.doneOpen = null; refresh(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
window.addEventListener("hashchange", () => {
  const q0 = ui.q, s0 = ui.sort;
  const c = readHash();
  showTab();
  if (data && (q0 !== ui.q || s0 !== ui.sort)) { render(); listsToTop(); if (q0 !== ui.q) loadDecisions(); }
  if (c && c !== ui.car) openCar(c);
  else if (!c && ui.car) closePanel();
});

function topHeight() { document.documentElement.style.setProperty("--top-h", $(".top").offsetHeight + "px"); }
window.addEventListener("resize", topHeight);
topHeight();
const startCar = readHash();
showTab();
if (startCar) { ui.car = startCar; $("#panel").hidden = false; document.body.classList.add("with-panel"); }
refresh();
</script>
</body>
