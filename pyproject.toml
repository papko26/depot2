[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "depot2"
version = "0.1.0"
description = "A planning and merge depot for a team that works through outside runners"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "papko26"}, {name = "dice cafe"}]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]

[project.scripts]
depot2 = "depot2.cli:main"

[tool.setuptools]
packages = ["depot2", "depot2.catalogs", "depot2.executors"]

[tool.setuptools.package-data]
depot2 = ["web/*"]

[dependency-groups]
dev = [
    "ruff==0.17.6",
    "mypy==1.14.1",
    "pytest>=9.2.0",
    "pytest-xdist>=3.8.0",
]

[tool.ruff.lint]
select = ["B", "C4", "E9", "F", "FA", "G", "I", "RET", "RUF021", "RUF059", "RUF100", "TC", "UP"]
ignore = [
    "B904",   # raise-without-from-inside-except
]
