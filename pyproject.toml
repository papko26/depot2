[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "depot2"
version = "0.1.0"
description = "A planning and merge depot for a team that works through outside runners"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "papko26"}, {name = "dice cafe"}]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]

[project.scripts]
depot2 = "depot2.cli:main"

[tool.setuptools]
packages = ["depot2", "depot2.catalogs", "depot2.executors"]

[tool.setuptools.package-data]
depot2 = ["web/*"]

[dependency-groups]
dev = [
    "ruff==0.17.6",
    "mypy==1.14.1",
    "pytest>=9.2.0",
    "pytest-xdist>=3.8.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "E4",   # pycodestyle
    "E7",   # pycodestyle
    "E9",   # pycodestyle
    "F",    # Pyflakes
    "FA",   # flake8-future-annotations
    "FURB", # refurb
    "G",    # flake8-logging-format
    "I",    # isort
    "LOG",  # flake8-logging
    "PGH",  # pygrep-hooks
    "PIE",  # flake8-pie
    "PLE",  # Pylint errors
    "RET",  # flake8-return
    "RUF",  # Ruff-specific rules
    "SIM",  # flake8-simplify
    "T10",  # flake8-debugger
    "TC",   # flake8-type-checking
    "UP",   # pyupgrade
    "YTT",  # flake8-2020
]
extend-select = [
    "ANN204", # missing-return-type-special-method
    "D204", # incorrect-blank-line-after-class
    "D208", # over-indentation
    "D209", # new-line-after-last-paragraph
    "PTH101", # os-chmod
    "PTH102", # os-mkdir
    "PTH104", # os-rename
    "PTH116", # os-stat
    "PTH121", # os-path-samefile
    "PTH124", # py-path
    "PTH201", # path-constructor-current-directory
    "PTH202", # os-path-getsize
    "PTH203", # os-path-getatime
    "PTH204", # os-path-getmtime
    "PTH205", # os-path-getctime
    "PTH210", # invalid-pathlib-with-suffix
    "Q",      # flake8-quotes
    "RSE102", # unnecessary-paren-on-raise-exception
]
ignore = [
    "E402",   # module-import-not-at-top-of-file
]
# Russian alphabet, uppercase and lowercase
allowed-confusables = [
    "А", "Б", "В", "Г", "Д", "Е", "Ё", "Ж", "З", "И", "Й",
    "К", "Л", "М", "Н", "О", "П", "Р", "С", "Т", "У", "Ф",
    "Х", "Ц", "Ч", "Ш", "Щ", "Ъ", "Ы", "Ь", "Э", "Ю", "Я",
    "а", "б", "в", "г", "д", "е", "ё", "ж", "з", "и", "й",
    "к", "л", "м", "н", "о", "п", "р", "с", "т", "у", "ф",
    "х", "ц", "ч", "ш", "щ", "ъ", "ы", "ь", "э", "ю", "я",
]
