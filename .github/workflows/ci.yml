name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.10"
          python-version: ${{ matrix.python-version }}
      - run: make install
      - name: Lint
        run: make lint
        continue-on-error: true
      - run: make typecheck
      - run: make test
